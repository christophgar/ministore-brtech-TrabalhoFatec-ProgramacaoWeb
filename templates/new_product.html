{% extends 'layout.html' %}{% block content %}<a href="{{ url_for('admin') }}">← Voltar ao painel</a><h1>Cadastrar produto<span>.</span></h1><section class="panel"><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Nome<input name="name" required maxlength="100"></label><label>Categoria<input name="category" required maxlength="50" list="product-categories"><datalist id="product-categories">{% for category in categories %}<option value="{{ category }}">{% endfor %}</datalist></label><label>Descrição e especificações<textarea name="description" maxlength="500" rows="4"></textarea></label><label>Preço (R$)<input name="price" type="number" step="0.01" min="0.01" required></label><label>Quantidade em estoque<input name="stock" type="number" min="0" required></label><label>Foto do produto (opcional)<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><p class="muted">JPG, PNG ou WebP de até 2 MB. Sem foto, aparece a ilustração padrão.</p><button>Cadastrar produto</button></form></section>{% endblock %}
